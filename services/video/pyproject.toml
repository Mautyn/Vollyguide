[project]
name = "volleyvideo"
version = "0.1.0"
description = "Local match video analysis for Volleyguide. Videos and results never leave your computer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2,<3",
  "scipy>=1.13,<2",
  "opencv-python>=4.10",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff==0.16.*"]
# Player detection and tracking on an NVIDIA GPU. Install PyTorch with CUDA first (see README).
track = ["torch>=2.7", "ultralytics>=8.3", "lap>=0.5.12"]

[project.scripts]
volleyvideo = "volleyvideo.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volleyvideo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Translated sentences are easier to review on one line.
"src/volleyvideo/i18n.py" = ["E501"]
